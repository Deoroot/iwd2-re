# ghidra-ai-bridge config for IWD2-re  (branch: re-agent-workflow)
# Read by `ghidra-bridge` and, through it, by `re-agent`.
# Replaces the old GhidraMCP (:8089) HTTP path with PyGhidra headless export.

ghidra:
  install_dir: C:\ghidra_dist\ghidra_12.1_PUBLIC   # from $GHIDRA_INSTALL_DIR
  project_dir: C:\ghidra_projects\IWD2             # contains IWD2.gpr + IWD2.rep
  project_name: IWD2
  program_name: IWD2.exe                            # verify in the Ghidra project tree

paths:
  export_dir: C:\iwd2-re\.ghidra-exports
  # Generated by scripts/reagent_address_map.py (NOT `ghidra-bridge build-map`):
  # our source marks functions with bare `// 0xADDR` comments, which build-map's
  # (name, address) capture-order contract cannot express. See that script's docstring.
  address_map: C:\iwd2-re\.ghidra-exports\address_map.json

source:
  root: C:\iwd2-re\src
  # No hook/stub macros in our source (faithful to IWD2.exe). hook_patterns and
  # stub_patterns are intentionally empty; the address map is built externally and
  # `remaining` falls back to `unimplemented` (Ghidra index minus address map).
  file_extensions: [".cpp", ".h", ".hpp"]

binary:
  # IWD2.exe: no ASLR, ImageBase 0x400000. .text roughly 0x401000..~0x7d0000;
  # .rdata/.data above ~0x840000. Range filters containing-address lookups.
  code_range_min: "0x00401000"
  code_range_max: "0x00800000"
